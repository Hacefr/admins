<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Communications</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-tertiary: #1e1f22;
      --bg-secondary: #2b2d31;
      --bg-primary: #313338;
      --bg-input: #383a40;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --interactive-hover: #dcddde;
      --brand: #5865f2;
      --brand-hover: #4752c4;
      --danger: #da373c;
      --role-owner: #f1c40f;
      --role-moderator: #e74c3c;
      --role-helper: #3498db;
      --role-tester: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans', sans-serif;
      background-color: var(--bg-tertiary);
      color: var(--text-normal);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* LOGIN MODAL */
    #loginOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-box {
      background: var(--bg-primary); width: 380px; padding: 32px;
      border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center;
    }
    .login-box h2 { color: #fff; margin-bottom: 8px; font-size: 1.4rem; }
    .login-box p { color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem; }
    .input-field {
      width: 100%; background: var(--bg-tertiary); border: none; padding: 12px;
      border-radius: 4px; color: #fff; margin-bottom: 16px; font-size: 0.95rem;
    }
    .btn-brand {
      width: 100%; background: var(--brand); color: #fff; border: none; padding: 12px;
      border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.95rem;
    }
    .btn-brand:hover { background: var(--brand-hover); }

    /* DISCORD APP LAYOUT */
    .guild-bar {
      width: 72px; background: var(--bg-tertiary); display: flex;
      flex-direction: column; align-items: center; padding-top: 12px; gap: 8px;
    }
    .server-icon {
      width: 48px; height: 48px; background: var(--brand); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: #fff;
      font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .server-icon:hover { border-radius: 16px; }

    /* CHANNELS SIDEBAR */
    .channels-bar {
      width: 240px; background: var(--bg-secondary); display: flex;
      flex-direction: column; border-top-left-radius: 8px;
    }
    .server-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center;
      justify-content: space-between; font-weight: 700; color: #fff;
      border-bottom: 1px solid #202225;
    }
    .channel-list { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .channel-category {
      font-size: 0.75rem; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; padding: 8px;
    }
    .channel-item {
      display: flex; align-items: center; padding: 8px; border-radius: 4px;
      color: var(--text-muted); cursor: pointer; font-size: 0.95rem; margin-bottom: 2px;
    }
    .channel-item:hover { background: rgba(255,255,255,0.05); color: var(--interactive-hover); }
    .channel-item.active { background: rgba(255,255,255,0.1); color: #fff; }
    .channel-prefix { font-size: 1.2rem; margin-right: 6px; }

    /* USER BAR AT BOTTOM OF CHANNELS */
    .user-footer {
      height: 52px; background: #232428; display: flex; align-items: center;
      padding: 0 8px; gap: 8px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--brand);
      display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff;
    }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 0.85rem; font-weight: 600; color: #fff; white-space: nowrap; }
    .user-role-badge { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .footer-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; padding: 4px; }
    .footer-btn:hover { color: #fff; }

    /* CHAT MAIN AREA */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
    .chat-header {
      height: 48px; border-bottom: 1px solid #202225; display: flex;
      align-items: center; padding: 0 16px; font-weight: 700; color: #fff;
    }
    .message-stream { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .message-row { display: flex; gap: 14px; }
    .msg-content-box { flex: 1; }
    .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .msg-user { font-weight: 600; font-size: 0.95rem; }
    .msg-time { font-size: 0.75rem; color: var(--text-muted); }
    .msg-text { font-size: 0.95rem; line-height: 1.4; color: var(--text-normal); word-break: break-word; }

    .chat-input-box { padding: 0 16px 24px 16px; }
    .chat-input {
      width: 100%; background: var(--bg-input); border: none; border-radius: 8px;
      padding: 12px 16px; color: #fff; font-size: 0.95rem; outline: none;
    }

    /* RIGHT ROSTER SIDEBAR */
    .roster-bar {
      width: 220px; background: var(--bg-secondary); padding: 16px 12px;
      overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    }
    .roster-group-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-top: 8px; }
    .roster-member { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 4px; }
    .roster-name { font-size: 0.9rem; font-weight: 500; }

    /* OWNER MODAL */
    #ownerModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; z-index: 1001;
    }
    .modal-card {
      background: var(--bg-primary); width: 550px; max-height: 85vh; overflow-y: auto;
      padding: 24px; border-radius: 8px;
    }
    .modal-card h3 { color: #fff; margin-bottom: 12px; }
    .close-btn { background: #4e5058; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; float: right; }
    .danger-btn { background: var(--danger); border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN MODAL -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2>Welcome Back</h2>
      <p>Staff Private Communications Desk</p>
      <input type="text" id="logUser" class="input-field" placeholder="Username" />
      <input type="password" id="logPass" class="input-field" placeholder="Password" />
      <button class="btn-brand" onclick="login()">Log In</button>
      <div id="logErr" style="color:var(--danger); font-size:0.85rem; margin-top:10px;"></div>
    </div>
  </div>

  <!-- DISCORD LAYOUT -->
  <div class="guild-bar">
    <div class="server-icon">MC</div>
  </div>

  <!-- CHANNELS -->
  <div class="channels-bar">
    <div class="server-header">
      <span>Staff Operations</span>
    </div>
    <div class="channel-list">
      <div class="channel-category">Important</div>
      <div class="channel-item active" onclick="switchChannel('announcements', this)">
        <span class="channel-prefix">#</span> announcements
      </div>
      <div class="channel-item" onclick="switchChannel('general-staff', this)">
        <span class="channel-prefix">#</span> general-staff
      </div>

      <div class="channel-category">Restricted Desks</div>
      <div id="chMod" class="channel-item hidden" onclick="switchChannel('mod-enforcement', this)">
        <span class="channel-prefix">#</span> mod-enforcement
      </div>
      <div id="chTester" class="channel-item hidden" onclick="switchChannel('tester-lab', this)">
        <span class="channel-prefix">#</span> tester-lab
      </div>
    </div>

    <!-- CURRENT USER PROFILE STRIP -->
    <div class="user-footer">
      <div class="avatar" id="myAvatar">?</div>
      <div class="user-info">
        <div class="user-name" id="myName">Loading...</div>
        <div class="user-role-badge" id="myRole">...</div>
      </div>
      <button id="gearBtn" class="footer-btn hidden" title="Owner Management" onclick="openOwnerModal()">⚙️</button>
      <button class="footer-btn" title="Logout" onclick="logout()">🚪</button>
    </div>
  </div>

  <!-- CHAT WINDOW -->
  <div class="chat-area">
    <div class="chat-header">
      <span style="color:var(--text-muted); margin-right:6px;">#</span>
      <span id="activeChannelTitle">announcements</span>
    </div>

    <div class="message-stream" id="messageStream">
      <!-- Messages populate here -->
    </div>

    <div class="chat-input-box">
      <input type="text" id="chatInput" class="chat-input" placeholder="Message #announcements" onkeydown="handleKey(event)" />
    </div>
  </div>

  <!-- ROSTER SIDEBAR -->
  <div class="roster-bar" id="rosterBar">
    <div class="roster-group-title">Staff Members</div>
    <!-- Members populate here -->
  </div>

  <!-- OWNER MANAGEMENT MODAL -->
  <div id="ownerModal" class="hidden">
    <div class="modal-card">
      <button class="close-btn" onclick="closeOwnerModal()">Done</button>
      <h3>// Owner Staff Management</h3>

      <!-- 1. Add Staff -->
      <div style="background:var(--bg-secondary); padding:12px; border-radius:6px; margin: 14px 0;">
        <h4 style="color:#fff; font-size:0.9rem; margin-bottom:8px;">Add New Staff Member</h4>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <input type="text" id="newStaffUser" class="input-field" placeholder="Username" style="margin:0;" />
          <input type="password" id="newStaffPass" class="input-field" placeholder="Password" style="margin:0;" />
          <select id="newStaffRole" class="input-field" style="margin:0;">
            <option value="tester">QA Tester</option>
            <option value="helper">Helper</option>
            <option value="moderator">Moderator</option>
            <option value="owner">Co-Owner</option>
          </select>
          <button class="btn-brand" onclick="createStaff()">Create Account</button>
        </div>
      </div>

      <!-- 2. Staff Accounts Table -->
      <div style="background:var(--bg-secondary); padding:12px; border-radius:6px; margin-bottom:14px;">
        <h4 style="color:#fff; font-size:0.9rem; margin-bottom:8px;">Active Accounts</h4>
        <div id="accountsList" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>

      <!-- 3. Change Owner Password -->
      <div style="background:var(--bg-secondary); padding:12px; border-radius:6px;">
        <h4 style="color:#fff; font-size:0.9rem; margin-bottom:8px;">Change Owner Password</h4>
        <input type="password" id="newOwnerPass" class="input-field" placeholder="New Password" style="margin-bottom:8px;" />
        <button class="btn-brand" onclick="changeOwnerPass()">Save Password</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentChannel = 'announcements';
    let pollInterval = null;

    const roleColors = {
      owner: 'var(--role-owner)',
      moderator: 'var(--role-moderator)',
      helper: 'var(--role-helper)',
      tester: 'var(--role-tester)'
    };

    async function checkSession() {
      const res = await fetch('/api/session');
      const data = await res.json();
      if (data.loggedIn) {
        setupApp(data.user);
      } else {
        document.getElementById('loginOverlay').classList.remove('hidden');
      }
    }

    async function login() {
      const u = document.getElementById('logUser').value.trim();
      const p = document.getElementById('logPass').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('loginOverlay').classList.add('hidden');
        setupApp(data.user);
      } else {
        document.getElementById('logErr').textContent = data.error;
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      location.reload();
    }

    function setupApp(user) {
      currentUser = user;
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('myName').textContent = user.username;
      document.getElementById('myRole').textContent = user.role.toUpperCase();
      document.getElementById('myRole').style.color = roleColors[user.role] || '#fff';
      document.getElementById('myAvatar').textContent = user.username[0].toUpperCase();

      // Channel Visibility
      if (user.role === 'owner' || user.role === 'moderator') {
        document.getElementById('chMod').classList.remove('hidden');
      }
      if (user.role === 'owner' || user.role === 'tester') {
        document.getElementById('chTester').classList.remove('hidden');
      }
      if (user.role === 'owner') {
        document.getElementById('gearBtn').classList.remove('hidden');
      }

      switchChannel('announcements');
      loadRoster();

      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(loadMessages, 3000);
    }

    function switchChannel(channel, element) {
      currentChannel = channel;
      document.getElementById('activeChannelTitle').textContent = channel;
      document.getElementById('chatInput').placeholder = `Message #${channel}`;

      if (element) {
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
      }
      loadMessages();
    }

    async function loadMessages() {
      const res = await fetch(`/api/messages/${currentChannel}`);
      if (!res.ok) return;
      const messages = await res.json();
      const stream = document.getElementById('messageStream');

      stream.innerHTML = messages.map(m => `
        <div class="message-row">
          <div class="avatar" style="background:${roleColors[m.role] || '#5865f2'};">
            ${m.username[0].toUpperCase()}
          </div>
          <div class="msg-content-box">
            <div class="msg-header">
              <span class="msg-user" style="color:${roleColors[m.role] || '#fff'};">${m.username}</span>
              <span class="msg-time">${m.created_at}</span>
            </div>
            <div class="msg-text">${escapeHtml(m.content)}</div>
          </div>
        </div>
      `).join('');
    }

    async function handleKey(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('chatInput');
        const content = input.value.trim();
        if (!content) return;

        const res = await fetch(`/api/messages/${currentChannel}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });

        if (res.ok) {
          input.value = '';
          loadMessages();
        } else {
          const err = await res.json();
          alert(err.error);
        }
      }
    }

    async function loadRoster() {
      const res = await fetch('/api/roster');
      const roster = await res.json();
      const container = document.getElementById('rosterBar');
      container.innerHTML = `<div class="roster-group-title">Staff Members — ${roster.length}</div>` +
        roster.map(r => `
          <div class="roster-member">
            <div class="avatar" style="width:24px;height:24px;font-size:0.75rem;background:${roleColors[r.role] || '#5865f2'};">
              ${r.username[0].toUpperCase()}
            </div>
            <span class="roster-name" style="color:${roleColors[r.role] || '#fff'};">${r.username}</span>
          </div>
        `).join('');
    }

    // --- OWNER ACTIONS ---
    function openOwnerModal() {
      document.getElementById('ownerModal').classList.remove('hidden');
      loadAccountsList();
    }
    function closeOwnerModal() {
      document.getElementById('ownerModal').classList.add('hidden');
    }

    async function loadAccountsList() {
      const res = await fetch('/api/roster');
      const list = await res.json();
      document.getElementById('accountsList').innerHTML = list.map(a => `
        <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-tertiary); padding:6px 10px; border-radius:4px;">
          <span><strong>${a.username}</strong> (${a.role.toUpperCase()})</span>
          ${a.id === currentUser.id ? '<span style="font-size:0.75rem; color:#888;">[YOU]</span>' : `<button class="danger-btn" onclick="deleteAccount(${a.id})">Delete</button>`}
        </div>
      `).join('');
    }

    async function createStaff() {
      const u = document.getElementById('newStaffUser').value.trim();
      const p = document.getElementById('newStaffPass').value;
      const r = document.getElementById('newStaffRole').value;
      if (!u || !p) return alert('Enter username & password');

      const res = await fetch('/api/owner/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p, role: r })
      });
      const data = await res.json();
      if (data.success) {
        alert(`Account created for ${u}`);
        document.getElementById('newStaffUser').value = '';
        document.getElementById('newStaffPass').value = '';
        loadAccountsList();
        loadRoster();
      } else {
        alert(data.error);
      }
    }

    async function deleteAccount(id) {
      if (!confirm('Permanently delete this staff account?')) return;
      const res = await fetch(`/api/owner/users/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadAccountsList();
        loadRoster();
      }
    }

    async function changeOwnerPass() {
      const newPassword = document.getElementById('newOwnerPass').value;
      if (!newPassword) return alert('Enter a new password');
      const res = await fetch('/api/owner/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword })
      });
      if (res.ok) {
        alert('Password changed successfully');
        document.getElementById('newOwnerPass').value = '';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    checkSession();
  </script>
</body>
</html>
